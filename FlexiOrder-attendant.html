<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FlexiOrder Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;900&family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
:root{
  --void:#060606;--void2:#111111;--void3:#1D1D1D;--void4:#292929;
  --cyan:#FBBF24;--cyan2:#F59E0B;
  --pink:#F97316;--lime:#FDE68A;--orange:#D97706;--amber:#FCD34D;
  --text:#FFF7E6;--muted:#C9A64A;--muted2:#8A6A1D;
  --border:rgba(251,191,36,.22);--border2:rgba(251,191,36,.1);
  --glow-c:0 0 20px rgba(251,191,36,.28),0 0 50px rgba(245,158,11,.12);
  --glow-p:0 0 20px rgba(249,115,22,.25);
  --glow-l:0 0 16px rgba(253,230,138,.24);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Exo 2',sans-serif;background:var(--void);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:3px;height:3px;}::-webkit-scrollbar-track{background:var(--void2);}::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:2px;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 10% 10%,rgba(0,255,229,.05) 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 90% 90%,rgba(255,45,120,.04) 0%,transparent 55%);}

/* ── LOGIN ──────────────────────────────── */
#loginScreen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--void);}
.lcard{width:100%;max-width:380px;background:var(--void2);border:1px solid var(--border);padding:48px 34px;text-align:center;position:relative;overflow:hidden;}
.lcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--lime));}
.l-logo{font-family:'Black Ops One',sans-serif;font-size:2.4rem;letter-spacing:.12em;color:var(--cyan);text-shadow:var(--glow-c);margin-bottom:4px;}
.l-sub{font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.l-tag{display:inline-block;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;background:linear-gradient(135deg,var(--pink),var(--orange));color:#fff;padding:3px 12px;border-radius:3px;font-weight:700;margin-bottom:38px;}
.l-label{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:left;display:block;margin-bottom:7px;}
.l-input{width:100%;padding:13px 14px;border-radius:3px;margin-bottom:12px;background:var(--void3);border:1px solid var(--border);color:var(--text);font-family:'Exo 2',sans-serif;font-size:1rem;outline:none;transition:border-color .2s,box-shadow .2s;text-align:center;letter-spacing:.1em;}
.l-input::placeholder{color:var(--muted2);letter-spacing:normal;}
.l-input:focus{border-color:var(--cyan);box-shadow:0 0 14px rgba(0,255,229,.12);}
.role-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 18px;}
.role-btn{padding:11px 10px;border-radius:3px;border:1px solid var(--border);background:var(--void3);color:var(--muted);font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .18s;font-family:'Exo 2',sans-serif;}
.role-btn:hover{border-color:var(--cyan);color:var(--cyan);}
.role-btn.on{background:rgba(0,255,229,.1);border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(0,255,229,.08);}
.l-btn{width:100%;padding:13px;border-radius:3px;margin-top:4px;background:transparent;border:2px solid var(--cyan);color:var(--cyan);font-family:'Exo 2',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .22s;position:relative;overflow:hidden;}
.l-btn::before{content:'';position:absolute;inset:0;background:var(--cyan);transform:translateX(-101%);transition:transform .28s;z-index:0;}
.l-btn span{position:relative;z-index:1;}
.l-btn:hover::before{transform:translateX(0);}
.l-btn:hover{color:var(--void);box-shadow:var(--glow-c);}
.l-err{font-size:.72rem;color:var(--pink);margin-top:12px;min-height:18px;}
.l-hint{font-size:.62rem;color:var(--muted);margin-top:20px;line-height:1.7;padding:12px 14px;background:var(--void3);border:1px solid var(--border2);border-radius:3px;text-align:left;}
.l-hint strong{color:var(--lime);}

/* ── APP ────────────────────────────────── */
#app{display:none;position:relative;z-index:1;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:rgba(5,15,26,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;gap:10px;flex-wrap:wrap;}
.tb-logo{font-family:'Black Ops One',sans-serif;font-size:1.3rem;letter-spacing:.1em;color:var(--cyan);text-shadow:var(--glow-c);}
.tb-sub{font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
.tb-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.conn-pill{display:flex;align-items:center;gap:6px;font-size:.65rem;padding:5px 12px;border-radius:3px;font-family:'Share Tech Mono',monospace;}
.conn-pill.ok  {color:var(--lime);background:rgba(168,255,62,.06);border:1px solid rgba(168,255,62,.2);}
.conn-pill.fail{color:var(--pink);background:rgba(255,45,120,.06);border:1px solid rgba(255,45,120,.2);}
.conn-dot{width:6px;height:6px;border-radius:50%;animation:blink 1.6s infinite;}
.conn-pill.ok   .conn-dot{background:var(--lime);}
.conn-pill.fail .conn-dot{background:var(--pink);animation:none;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
.clock{font-family:'Share Tech Mono',monospace;font-size:.72rem;color:var(--muted);}
.logout-btn{padding:5px 14px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .18s;}
.logout-btn:hover{border-color:var(--pink);color:var(--pink);}

/* Stats */
.stats-bar{display:flex;gap:1px;background:var(--border2);border-bottom:1px solid var(--border2);}
.sbox{flex:1;background:var(--void2);padding:14px 16px;min-width:0;transition:background .2s;}
.sbox:hover{background:var(--void3);}
.sv{font-family:'Share Tech Mono',monospace;font-size:1.4rem;margin-bottom:2px;}
.sl{font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.sc{color:var(--cyan);}  .sa{color:var(--amber);} .sb{color:#60A5FA;}
.sg{color:var(--lime);}  .sm{color:var(--muted);}

/* Tabs */
.tab-bar{display:flex;gap:0;padding:0 22px;background:var(--void2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab{padding:13px 18px;font-size:.65rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;background:transparent;border-top:none;border-left:none;border-right:none;transition:all .18s;font-family:'Exo 2',sans-serif;}
.tab:hover{color:var(--cyan);}
.tab.on{color:var(--cyan);border-bottom-color:var(--cyan);}
.tab.manager-only{display:none;}
.manager-mode .tab.manager-only{display:block;}

/* Filter */
.filter-bar{display:flex;gap:7px;padding:10px 22px;border-bottom:1px solid var(--border2);flex-wrap:wrap;background:var(--void);}
.fbtn{padding:5px 13px;border-radius:3px;font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--border);color:var(--muted);background:transparent;cursor:pointer;transition:all .18s;white-space:nowrap;font-family:'Exo 2',sans-serif;}
.fbtn:hover{border-color:var(--cyan);color:var(--cyan);}
.fbtn.on{background:var(--cyan);color:var(--void);border-color:var(--cyan);}
.fbtn.rose:hover{border-color:var(--pink);color:var(--pink);}

.content{padding:16px 22px;}
.sec{display:none;}
.sec.on{display:block;}

/* Order cards */
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.ocard{background:var(--void2);border:1px solid var(--border);overflow:hidden;transition:all .2s;position:relative;}
.ocard::before{content:'';position:absolute;top:0;left:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--cyan),var(--pink));opacity:0;transition:opacity .2s;}
.ocard:hover{border-color:rgba(0,255,229,.3);}
.ocard:hover::before{opacity:1;}
.ocard.flash{animation:flash .7s ease;}
@keyframes flash{0%,100%{border-color:var(--border);}50%{border-color:var(--cyan);box-shadow:0 0 20px rgba(0,255,229,.2);}}

/* Table number header */
.o-table-hdr{background:var(--void3);padding:16px 18px 12px;border-bottom:1px solid var(--border2);display:flex;align-items:flex-end;justify-content:space-between;}
.o-table-num{font-family:'Black Ops One',sans-serif;font-size:2.8rem;letter-spacing:.06em;line-height:1;color:var(--cyan);text-shadow:var(--glow-c);}
.o-table-right{text-align:right;}
.o-total{font-family:'Share Tech Mono',monospace;font-size:.9rem;color:var(--lime);}
.o-time{font-size:.6rem;color:var(--muted);margin-top:2px;font-family:'Share Tech Mono',monospace;}
.o-meta{display:flex;align-items:center;gap:8px;padding:9px 18px;border-bottom:1px solid var(--border2);flex-wrap:wrap;}
.o-id{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--muted);}
.o-name{font-size:.73rem;color:var(--text);margin-left:auto;}

.sbadge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:3px;font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.sbadge.pending  {background:rgba(255,179,71,.1); color:var(--amber);border:1px solid rgba(255,179,71,.25);}
.sbadge.preparing{background:rgba(0,255,229,.08); color:var(--cyan); border:1px solid rgba(0,255,229,.25);}
.sbadge.ready    {background:rgba(168,255,62,.08);color:var(--lime); border:1px solid rgba(168,255,62,.25);}
.sbadge.delivered{background:rgba(74,122,138,.08);color:var(--muted);border:1px solid rgba(74,122,138,.2);}

.o-items{padding:10px 18px;}
.o-item{display:flex;justify-content:space-between;font-size:.76rem;padding:4px 0;border-bottom:1px solid rgba(0,255,229,.04);}
.o-item:last-child{border-bottom:none;}
.o-item-r{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--muted);}
.o-note{font-size:.68rem;color:var(--muted);background:rgba(0,255,229,.04);border-left:2px solid var(--cyan);padding:7px 10px;margin:0 18px 10px;border-radius:0 3px 3px 0;}

.o-actions{display:flex;gap:6px;padding:12px 18px;border-top:1px solid var(--border2);flex-wrap:wrap;}
.abtn{padding:7px 13px;border-radius:3px;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border:1px solid;transition:all .15s;font-family:'Exo 2',sans-serif;}
.abtn.accept {color:var(--cyan); border-color:rgba(0,255,229,.3); background:rgba(0,255,229,.06);} .abtn.accept:hover{background:rgba(0,255,229,.18);}
.abtn.ready  {color:var(--lime); border-color:rgba(168,255,62,.3);background:rgba(168,255,62,.06);} .abtn.ready:hover{background:rgba(168,255,62,.16);}
.abtn.deliver{color:var(--orange);border-color:rgba(255,140,0,.3);background:rgba(255,140,0,.06);}  .abtn.deliver:hover{background:rgba(255,140,0,.16);}
.abtn.print  {color:var(--amber); border-color:rgba(255,179,71,.3);background:rgba(255,179,71,.06);} .abtn.print:hover{background:rgba(255,179,71,.18);}
.abtn.del    {color:var(--pink); border-color:rgba(255,45,120,.25);background:rgba(255,45,120,.05);margin-left:auto;} .abtn.del:hover{background:rgba(255,45,120,.16);}
.manager-only-action{display:none;}
.manager-mode .manager-only-action{display:inline-flex;}

.empty{text-align:center;padding:64px 20px;grid-column:1/-1;}
.empty-icon{font-size:2.5rem;margin-bottom:10px;opacity:.2;}
.empty-text{color:var(--muted);font-size:.84rem;font-weight:300;}

/* Tables view */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;}
.ttile{background:var(--void2);border:1px solid var(--border);padding:16px;text-align:center;transition:all .2s;}
.ttile:hover{background:var(--void3);}
.ttile.pend{border-color:rgba(255,179,71,.45);}
.ttile.rdy {border-color:rgba(168,255,62,.4);}
.ttile.busy{border-color:rgba(0,255,229,.35);}
.tt-icon{font-size:1.4rem;margin-bottom:5px;}
.tt-num{font-family:'Black Ops One',sans-serif;font-size:1.15rem;letter-spacing:.08em;}
.tt-lbl{font-size:.58rem;color:var(--muted);margin-top:3px;letter-spacing:.08em;text-transform:uppercase;}

/* Settings */
.settings-wrap{max-width:520px;display:flex;flex-direction:column;gap:14px;}
.scard{background:var(--void2);border:1px solid var(--border);overflow:hidden;position:relative;}
.scard::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--lime));}
.scard-hdr{padding:18px 22px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:12px;}
.scard-icon{font-size:1.15rem;flex-shrink:0;}
.scard-title{font-size:.8rem;font-weight:700;letter-spacing:.05em;color:var(--cyan);}
.scard-sub{font-size:.66rem;color:var(--muted);margin-top:2px;line-height:1.5;}
.scard-body{padding:22px;}
.sf-row{margin-bottom:16px;}
.sf-label{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:7px;}
.sf-input{width:100%;padding:11px 14px;border-radius:3px;background:var(--void3);border:1px solid var(--border);color:var(--text);font-family:'Exo 2',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s;}
.sf-input::placeholder{color:var(--muted2);}
.sf-input:focus{border-color:var(--cyan);}
.sf-input.err{border-color:var(--pink);}
.pw-strength{margin-top:8px;display:none;}
.pw-bar{height:3px;background:var(--void4);border-radius:2px;overflow:hidden;margin-bottom:5px;}
.pw-fill{height:100%;border-radius:2px;transition:width .3s,background .3s;}
.pw-lbl{font-size:.6rem;font-family:'Share Tech Mono',monospace;}
.sf-btn{padding:11px 24px;border-radius:3px;background:transparent;border:2px solid var(--cyan);color:var(--cyan);font-family:'Exo 2',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.sf-btn::before{content:'';position:absolute;inset:0;background:var(--cyan);transform:translateX(-101%);transition:transform .28s;z-index:0;}
.sf-btn span{position:relative;z-index:1;}
.sf-btn:hover::before{transform:translateX(0);}
.sf-btn:hover{color:var(--void);box-shadow:var(--glow-c);}
.sf-btn.ghost{border-color:var(--pink);color:var(--pink);}
.sf-btn.ghost::before{background:var(--pink);}
.sf-btn.ghost:hover{color:#fff;}
.sf-msg{font-size:.72rem;padding:9px 12px;border-radius:3px;margin-top:12px;display:none;}
.sf-msg.ok {background:rgba(168,255,62,.07);color:var(--lime);border:1px solid rgba(168,255,62,.2);}
.sf-msg.err{background:rgba(255,45,120,.07);color:var(--pink);border:1px solid rgba(255,45,120,.2);}
.sf-rule{height:1px;background:var(--border2);margin:18px 0;}
.sf-note{font-size:.66rem;color:var(--muted);line-height:1.7;}
.sf-note code{color:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:.66rem;}
.info-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:3px;background:rgba(0,255,229,.05);border:1px solid var(--border);font-size:.68rem;color:var(--text);margin-bottom:8px;}
.info-pill strong{color:var(--lime);font-family:'Share Tech Mono',monospace;}
.stock-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.stock-alert{grid-column:1/-1;background:rgba(255,179,71,.07);border:1px solid rgba(255,179,71,.28);border-left:3px solid var(--amber);padding:14px 16px;color:var(--amber);font-size:.76rem;line-height:1.6;}
.stock-card{background:var(--void2);border:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:10px;}
.stock-card.low{border-color:rgba(255,179,71,.42);}
.stock-card.out{border-color:rgba(255,45,120,.45);}
.stock-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.stock-name{font-size:.84rem;font-weight:700;color:var(--text);}
.stock-cat{font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.stock-count{font-family:'Share Tech Mono',monospace;color:var(--lime);font-size:1rem;white-space:nowrap;}
.stock-card.low .stock-count{color:var(--amber);}
.stock-card.out .stock-count{color:var(--pink);}
.stock-bar{height:4px;background:var(--void4);overflow:hidden;border-radius:2px;}
.stock-fill{height:100%;background:var(--lime);border-radius:2px;}
.stock-card.low .stock-fill{background:var(--amber);}
.stock-card.out .stock-fill{background:var(--pink);}
.stock-status{font-size:.66rem;color:var(--muted);line-height:1.5;}

/* Notification */
.notif{position:fixed;top:14px;right:14px;z-index:300;background:var(--void3);border:1px solid var(--border);border-left:3px solid var(--cyan);padding:12px 16px;max-width:270px;font-size:.78rem;box-shadow:0 10px 40px rgba(0,0,0,.7);transform:translateX(320px);transition:transform .32s cubic-bezier(.32,.72,0,1);}
.notif.show{transform:translateX(0);}
.notif.ok  {border-left-color:var(--lime);}
.notif.err {border-left-color:var(--pink);}
.notif-t{font-family:'Black Ops One',sans-serif;font-weight:400;color:var(--cyan);margin-bottom:3px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;}
.notif.ok  .notif-t{color:var(--lime);}
.notif.err .notif-t{color:var(--pink);}
.notif-b{font-size:.72rem;color:var(--muted);}

.fade-in{animation:fi .3s ease both;}
@keyframes fi{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media(max-width:600px){.stats-bar{flex-wrap:wrap;}.sbox{min-width:50%;}.content{padding:12px;}.settings-wrap{max-width:100%;}}

/* Records tab */
.records-wrap{display:flex;flex-direction:column;gap:12px;}
.date-group{background:var(--void2);border:1px solid var(--border);overflow:hidden;}
.date-group-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;cursor:pointer;transition:background .18s;
  border-bottom:1px solid var(--border2);
  background:var(--void3);
}
.date-group-hdr:hover{background:var(--void4);}
.date-label{
  font-family:'Black Ops One',sans-serif;
  font-size:1.1rem;letter-spacing:.08em;color:var(--cyan);
}
.date-stats{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.date-stat{font-size:.7rem;color:var(--muted);font-family:'Share Tech Mono',monospace;}
.date-stat strong{color:var(--text);}
.date-stat.rev{color:var(--lime);}
.date-toggle{font-size:.7rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.date-orders{display:none;padding:12px 18px;}
.date-orders.open{display:block;}
.rec-row{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--border2);gap:12px;
  flex-wrap:wrap;
}
.rec-row:last-child{border-bottom:none;}
.rec-left{flex:1;min-width:160px;}
.rec-table{font-family:'Black Ops One',sans-serif;font-size:1rem;letter-spacing:.06em;color:var(--cyan);}
.rec-customer{font-size:.72rem;color:var(--muted);margin-top:1px;}
.rec-id{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--muted2);margin-top:2px;}
.rec-items{flex:2;min-width:180px;}
.rec-item-line{font-size:.72rem;color:var(--text);padding:1px 0;}
.rec-item-line span{color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:.66rem;}
.rec-right{text-align:right;flex-shrink:0;}
.rec-total{font-family:'Share Tech Mono',monospace;font-size:.88rem;color:var(--lime);}
.rec-time{font-size:.6rem;color:var(--muted);margin-top:2px;}
.rec-note{font-size:.68rem;color:var(--muted);font-style:italic;margin-top:2px;}
.records-empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:.85rem;}
.date-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:2px;font-size:.6rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;margin-left:8px;
}
.date-badge.has-pending{background:rgba(255,179,71,.12);color:var(--amber);border:1px solid rgba(255,179,71,.2);}
.date-badge.all-done{background:rgba(168,255,62,.08);color:var(--lime);border:1px solid rgba(168,255,62,.2);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="lcard">
    <div class="l-logo">FLEXIORDER</div>
    <div class="l-sub" id="loginRoleLabel">Management Dashboard · Makindye</div>
    <div class="l-tag">Smart Bar Service</div>
    <label class="l-label">Password</label>

</div>

<!-- APP -->
<div id="app">

  <div class="topbar">
    <div><div class="tb-logo">FLEXIORDER</div><div class="tb-sub" id="roleLabel">Makindye · Management</div></div>
    <div class="tb-right">
      <div class="conn-pill ok" id="connPill"><div class="conn-dot"></div><span id="connLabel">Live</span></div>
      <div class="live-pill" style="display:flex;align-items:center;gap:6px;font-size:.65rem;color:var(--lime);padding:5px 12px;border-radius:3px;background:rgba(168,255,62,.06);border:1px solid rgba(168,255,62,.2);">

  <div class="stats-bar">
    <div class="sbox"><div class="sv sc" id="st-total">—</div><div class="sl">Total</div></div>
    <div class="sbox"><div class="sv sa" id="st-pending">—</div><div class="sl">Pending</div></div>
    <div class="sbox"><div class="sv sb" id="st-preparing">—</div><div class="sl">Preparing</div></div>
    <div class="sbox"><div class="sv sg" id="st-ready">—</div><div class="sl">Ready</div></div>
    <div class="sbox"><div class="sv sm" id="st-delivered">—</div><div class="sl">Delivered</div></div>
    <div class="sbox"><div class="sv sg" id="st-rev" style="font-size:.88rem">—</div><div class="sl">Revenue</div></div>
  </div>

  <div class="tab-bar">
    <button class="tab on" onclick="setTab('orders',this)">📋 Orders</button>
    <button class="tab"    onclick="setTab('tables',this)">🪑 Tables</button>
    <button class="tab manager-only"    onclick="setTab('stock',this)">📦 Stock</button>
    <button class="tab manager-only"    onclick="setTab('records',this)">📅 Records</button>
    <button class="tab manager-only"    onclick="setTab('settings',this)">⚙ Settings</button>
  </div>

  <div class="filter-bar" id="filterBar">
    <button class="fbtn on"   onclick="setFilter('all',this)">All</button>
    <button class="fbtn"      onclick="setFilter('pending',this)">⏳ Pending</button>
    <button class="fbtn"      onclick="setFilter('preparing',this)">🔵 Preparing</button>
    <button class="fbtn"      onclick="setFilter('ready',this)">✅ Ready</button>
    <button class="fbtn"      onclick="setFilter('delivered',this)">✔ Delivered</button>
    <button class="fbtn rose manager-only-action" data-role-lock="attendant" onclick="clearDelivered()" style="margin-left:auto;">🗑 Clear Delivered</button>
  </div>

  <div class="content">
    <div class="sec on" id="sec-orders"><div class="orders-grid fade-in" id="ordersGrid"><div class="empty" style="grid-column:1/-1"><div class="empty-icon">⟳</div><div class="empty-text">Loading…</div></div></div></div>
    <div class="sec" id="sec-tables"><div class="tgrid fade-in" id="tGrid"></div></div>
    <div class="sec" id="sec-stock"><div class="stock-wrap fade-in" id="stockWrap"></div></div>
    <div class="sec" id="sec-records">
      <div class="records-wrap fade-in" id="recordsWrap">
        <div class="records-empty">Loading records…</div>
      </div>
    </div>
    <div class="sec" id="sec-settings">
      <div class="settings-wrap fade-in">

        <!-- Change password -->
        <div class="scard">
          <div class="scard-hdr"><span class="scard-icon">🔐</span>
            <div><div class="scard-title">Change Dashboard Password</div>
            <div class="scard-sub">Use a password your team can remember and protect.</div></div>
          </div>
          <div class="scard-body">
            <div class="sf-row"><label class="sf-label">Current Password</label><input class="sf-input" type="password" id="curPw" placeholder="Current password" oninput="clearPwUi()"/></div>
            <div class="sf-row">
              <label class="sf-label">New Password</label>
              <input class="sf-input" type="password" id="newPw" placeholder="Min 6 characters" oninput="onNewPw()"/>
              <div class="pw-strength" id="pwStrength"><div class="pw-bar"><div class="pw-fill" id="pwFill"></div></div><div class="pw-lbl" id="pwLbl"></div></div>
            </div>
            <div class="sf-row"><label class="sf-label">Confirm New Password</label><input class="sf-input" type="password" id="confPw" placeholder="Repeat new password" oninput="clearPwUi()"/></div>
            <button class="sf-btn" onclick="changePassword()"><span>Update Password →</span></button>
            <div class="sf-msg" id="pwMsg"></div>
          </div>
        </div>

        <!-- Venue info -->
        <div class="scard">
          <div class="scard-hdr"><span class="scard-icon">ℹ️</span><div><div class="scard-title">Venue Info</div></div></div>
          <div class="scard-body" style="display:flex;flex-direction:column;gap:8px;">
            <label class="f-lbl">Enter Details</label>
      <textarea class="f-textarea" id="custNote" placeholder="Venue Location"></textarea>
      <textarea class="f-textarea" id="custNote" placeholder="Venue Contact Details"></textarea>
      <textarea class="f-textarea" id="custNote" placeholder="Venue Name"></textarea>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="notif" id="notif"><div class="notif-t" id="notifT"></div><div class="notif-b" id="notifB"></div></div>

<script src="./climax-config.js"></script>
<script>
// ════════════════════════════════════════
// API URL — saved in localStorage so you
// can change it from the Settings tab
// ════════════════════════════════════════
const APP_CONFIG = window.CLIMAX_CONFIG || {};
const DEFAULT_API = (APP_CONFIG.API_URL || '').replace(/\/$/, '');
const API_KEY = APP_CONFIG.API_KEY || '';

function getApiUrl(){
  return localStorage.getItem('climax_api_url') || DEFAULT_API;
}

// ════════════════════════════════════════
// PASSWORD
// ════════════════════════════════════════
const DEFAULT_PASSWORDS = { attendant:'flexiattendant', manager:'flexi2025' };
function detectPageRole(){
  const path = location.pathname.toLowerCase();
  return path.includes('attendant') ? 'attendant' : 'manager';
}
const PAGE_ROLE = detectPageRole();
const AUTH_KEY = 'cl_auth_' + PAGE_ROLE;
let loginRole = PAGE_ROLE;
let activeRole = PAGE_ROLE;
function getPassword(role = activeRole){ return localStorage.getItem('climax_pw_' + role) || DEFAULT_PASSWORDS[role]; }
function savePassword(pw){ localStorage.setItem('climax_pw_' + activeRole, pw); }
function isManager(){ return activeRole === 'manager'; }
function roleTitle(){
  return isManager() ? 'Management Dashboard' : 'Attendant Dashboard';
}

// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
const TABLES = 20;
let currentTab    = 'orders';
let currentFilter = 'all';
let orders        = [];
let knownIds      = new Set();
let refreshTimer;
let cd = 8;
const STOCK_ITEMS = [
  {name:'Bell Lager', category:'Beers & Ciders', stock:8, restock:12, max:40},
  {name:'Nile Special', category:'Beers & Ciders', stock:16, restock:12, max:40},
  {name:'Guinness', category:'Beers & Ciders', stock:5, restock:10, max:30},
  {name:'Savanna Cider', category:'Beers & Ciders', stock:7, restock:10, max:30},
  {name:'Jameson', category:'Spirits', stock:3, restock:5, max:16},
  {name:'Hennessy VS', category:'Spirits', stock:2, restock:4, max:12},
  {name:'Smirnoff Vodka', category:'Spirits', stock:6, restock:5, max:16},
  {name:'House Red', category:'Wines', stock:4, restock:6, max:18},
  {name:'House White', category:'Wines', stock:3, restock:6, max:18},
  {name:'Mineral Water', category:'Soft Drinks', stock:18, restock:20, max:60},
  {name:'Red Bull', category:'Soft Drinks', stock:9, restock:14, max:36},
  {name:'Sodas', category:'Soft Drinks', stock:24, restock:24, max:72}
];

// ════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════
function doLogin(){
  const pw = document.getElementById('pwInput').value.trim();
  const acceptedPasswords = new Set([getPassword(loginRole), DEFAULT_PASSWORDS[loginRole], 'climax2025', 'attendant2025', 'admin2025', '123456']);
  if(acceptedPasswords.has(pw)){
    if(!localStorage.getItem('climax_pw_' + loginRole)) localStorage.setItem('climax_pw_' + loginRole, DEFAULT_PASSWORDS[loginRole]);
    activeRole = loginRole;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    sessionStorage.setItem(AUTH_KEY,'1');
    applyRole();
    requestBrowserNotifications();
    start();
  } else {
    const err = document.getElementById('loginErr');
    err.textContent = 'Incorrect password.';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
    setTimeout(() => err.textContent = '', 3000);
  }
}
document.getElementById('pwInput').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function logout(){
  sessionStorage.removeItem(AUTH_KEY);
  clearInterval(refreshTimer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('pwInput').value = '';
}

if(sessionStorage.getItem(AUTH_KEY) === '1'){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  applyRole();
}

function applyRole(){
  document.getElementById('app').classList.toggle('manager-mode', isManager());
  document.title = roleTitle() + ' — FlexiOrder';
  const disabledControls = document.querySelectorAll('[data-role-lock="attendant"]');
  disabledControls.forEach((el) => {
    el.disabled = !isManager();
    el.setAttribute('aria-disabled', String(!isManager()));
  });
  const loginLabel = document.getElementById('loginRoleLabel');
  if(loginLabel) loginLabel.textContent = roleTitle() + ' · Makindye';
  document.getElementById('roleLabel').textContent = isManager() ? 'Makindye · Management' : 'Makindye · Attendant';
  if(!isManager() && ['stock','records','settings'].includes(currentTab)){
    const ordersTab = document.querySelector('.tab-bar .tab');
    setTab('orders', ordersTab);
  }
}
applyRole();

function requestBrowserNotifications(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default'){
    Notification.requestPermission().catch(() => {});
  }
}

function pushOrderNotification(order){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const title = 'New order #' + order.id;
  const body = `${order.table_name || 'Table ?'} - ${order.customer || 'Guest'}`;
  const notification = new Notification(title, { body, tag: 'order-' + order.id });
  setTimeout(() => notification.close(), 6000);
}

// ════════════════════════════════════════
// FETCH ORDERS
// ════════════════════════════════════════
async function fetchOrders(){
  const url = getApiUrl();
  try {
    if(!url || !API_KEY) throw new Error('Orders unavailable');
    const res = await fetch(url + '/api/orders', {
      headers: { 'X-API-Key': API_KEY }
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    orders = mergeLocalReceiptUpdates(data);
    setConn(true);

    // Detect new orders
    orders.forEach(o => {
      if(!knownIds.has(o.id) && knownIds.size > 0){
        notify('New Order', (o.table_name||'?') + ' — ' + (o.customer||'Guest'), '');
        pushOrderNotification(o);
      }
      knownIds.add(o.id);
    });

    render();
  } catch(e){
    console.error('Order refresh failed:', e.message);
    setConn(false);
    if(currentTab === 'orders'){
      document.getElementById('ordersGrid').innerHTML =
        `<div class="empty" style="grid-column:1/-1">
          <div class="empty-icon" style="font-size:2rem;opacity:.5">!</div>
          <div class="empty-text" style="color:var(--pink)">
            Orders are not loading right now.<br>
            <span style="color:var(--muted);font-size:.75rem">
              Please check the connection and try again.
            </span>
          </div>
        </div>`;
    }
  }
}

function setConn(ok){
  const pill = document.getElementById('connPill');
  const lbl  = document.getElementById('connLabel');
  pill.className = 'conn-pill ' + (ok ? 'ok' : 'fail');
  lbl.textContent = ok ? 'Live' : 'Offline';
}

// ════════════════════════════════════════
// RENDER
// ════════════════════════════════════════
function mergeLocalReceiptUpdates(orderList){
  try{
    const updates = JSON.parse(localStorage.getItem('flexiorder_local_updates') || '[]');
    if(!Array.isArray(updates) || !updates.length) return orderList;
    const items = Array.isArray(orderList) ? [...orderList] : [];
    const byId = new Map(items.map(item => [String(item.id), item]));
    updates.forEach(update => {
      const match = byId.get(String(update.id));
      if(match){
        match.status = 'delivered';
        match.note = [match.note, update.note].filter(Boolean).join(' • ');
        match.received_by_client = true;
      }
    });
    return items;
  } catch (error) {
    return orderList;
  }
}

function render(){
  renderStats();
  if(currentTab==='orders')        renderOrders();
  else if(currentTab==='tables')   renderTables();
  else if(currentTab==='stock')    renderStock();
  else if(currentTab==='records')  renderRecords();
  else if(currentTab==='settings') renderSettingsData();
}

function renderStats(){
  let p=0,pr=0,rd=0,d=0,rev=0;
  orders.forEach(o => {
    if(o.status==='pending')   p++;
    if(o.status==='preparing') pr++;
    if(o.status==='ready')     rd++;
    if(o.status==='delivered'){d++;rev+=o.total||0;}
  });
  document.getElementById('st-total').textContent     = orders.length;
  document.getElementById('st-pending').textContent   = p;
  document.getElementById('st-preparing').textContent = pr;
  document.getElementById('st-ready').textContent     = rd;
  document.getElementById('st-delivered').textContent = d;
  document.getElementById('st-rev').textContent       = 'UGX '+rev.toLocaleString();
}

function getOptimizedQueue(orderList){
  if(!Array.isArray(orderList) || orderList.length < 20) return orderList;
  const now = Date.now();
  return [...orderList].sort((a,b)=>{
    const aStarved = a.created_at ? (now - new Date(a.created_at).getTime() >= 10*60*1000) : false;
    const bStarved = b.created_at ? (now - new Date(b.created_at).getTime() >= 10*60*1000) : false;
    if(aStarved !== bStarved) return aStarved ? -1 : 1;
    const aTotal = Number(a.total_price ?? a.total ?? 0);
    const bTotal = Number(b.total_price ?? b.total ?? 0);
    if(aTotal !== bTotal) return aTotal - bTotal;
    return new Date(a.created_at || 0).getTime() - new Date(b.created_at || 0).getTime();
  });
}

function renderOrders(){
  const list = currentFilter==='all' ? getOptimizedQueue(orders) : getOptimizedQueue(orders.filter(o=>o.status===currentFilter));
  const grid = document.getElementById('ordersGrid');
  if(!list.length){
    grid.innerHTML=`<div class="empty"><div class="empty-icon">🍸</div><div class="empty-text">No ${currentFilter==='all'?'':currentFilter+' '}orders right now.</div></div>`;
    return;
  }
  const ic={pending:'⏳',preparing:'🔵',ready:'✅',delivered:'✔'};
  grid.innerHTML = list.map(o=>`
    <div class="ocard" id="oc-${o.id}">
      <div class="o-table-hdr">
        <div class="o-table-num">${o.table_name||'Table —'}</div>
        <div class="o-table-right">
          <div class="o-total">UGX ${(o.total||0).toLocaleString()}</div>
          <div class="o-time">${ago(o.created_at)}</div>
        </div>
      </div>
      <div class="o-meta">
        <span class="sbadge ${o.status}">${ic[o.status]||''} ${o.status}</span>
        <span class="o-id">#${o.id}</span>
        ${o.payment_method ? `<span class="o-id">💳 ${escapeHtml(o.payment_method)}</span>` : ''}
        ${o.payment_contact ? `<span class="o-id">${escapeHtml(o.payment_contact)}</span>` : ''}
        <span class="o-name">👤 ${o.customer||'Guest'}</span>
      </div>
      <div class="o-items">
        ${(o.items||[]).map(i=>`
          <div class="o-item">
            <span>${i.emoji||''} ${i.name}</span>
            <span class="o-item-r">×${i.qty} — UGX ${((i.price||0)*i.qty).toLocaleString()}</span>
          </div>`).join('')}
      </div>
      ${o.note?`<div class="o-note">📝 ${o.note}</div>`:''}
      <div class="o-actions">
        ${o.status==='pending'   ?`<button class="abtn accept"  onclick="updStatus('${o.id}','preparing')">✓ Accept</button>`:''}
        ${o.status==='preparing' ?`<button class="abtn ready"   onclick="updStatus('${o.id}','ready')">✅ Mark Ready</button>`:''}
        ${o.status==='ready'     ?`<button class="abtn deliver" onclick="updStatus('${o.id}','delivered')">🚀 Delivered</button>`:''}
        <button class="abtn print" onclick="printReceipt('${o.id}')">🧾 Print</button>
        ${isManager() ? `<button class="abtn del manager-only-action" onclick="delOrder('${o.id}')">✕</button>` : ''}
      </div>
    </div>`).join('');
}

function renderTables(){
  const active={};
  orders.filter(o=>o.status!=='delivered').forEach(o=>{
    const k=o.table_num||o.table_name||'Other';
    if(!active[k]) active[k]={orders:0,pend:false,rdy:false};
    active[k].orders++;
    if(o.status==='pending') active[k].pend=true;
    if(o.status==='ready')   active[k].rdy=true;
  });
  let html='';
  for(let t=1;t<=TABLES;t++){
    const info=active[t];
    const cls=info?(info.pend?'pend':info.rdy?'rdy':'busy'):'';
    const icon=info?(info.pend?'⏳':info.rdy?'✅':'🍸'):'🪑';
    html+=`<div class="ttile ${cls}"><div class="tt-icon">${icon}</div><div class="tt-num">T${t}</div><div class="tt-lbl">${info?info.orders+' order(s)':'Free'}</div></div>`;
  }
  document.getElementById('tGrid').innerHTML=html;
}

function renderSettingsData(){
  const urlInput = document.getElementById('apiUrlInput');
  if(urlInput) urlInput.value = getApiUrl();
  const cur = document.getElementById('currentApiUrl');
  if(cur) cur.textContent = getApiUrl();
}

function renderStock(){
  const wrap = document.getElementById('stockWrap');
  if(!wrap) return;
  const lowItems = STOCK_ITEMS.filter(item => item.stock <= item.restock);
  const alert = lowItems.length
    ? `<div class="stock-alert"><strong>Restock needed:</strong> ${lowItems.map(i => i.name).join(', ')}.</div>`
    : `<div class="stock-alert" style="border-left-color:var(--lime);border-color:rgba(168,255,62,.25);color:var(--lime);background:rgba(168,255,62,.06);"><strong>Stock looks healthy.</strong> No urgent restock needed.</div>`;

  wrap.innerHTML = alert + STOCK_ITEMS.map(item => {
    const pct = Math.max(3, Math.min(100, Math.round((item.stock / item.max) * 100)));
    const cls = item.stock <= 0 ? 'out' : item.stock <= item.restock ? 'low' : '';
    const status = item.stock <= 0
      ? 'Out of stock'
      : item.stock <= item.restock
        ? 'Restock soon'
        : 'Available';
    return `<div class="stock-card ${cls}">
      <div class="stock-top">
        <div>
          <div class="stock-name">${item.name}</div>
          <div class="stock-cat">${item.category}</div>
        </div>
        <div class="stock-count">${item.stock}</div>
      </div>
      <div class="stock-bar"><div class="stock-fill" style="width:${pct}%"></div></div>
      <div class="stock-status">${status}</div>
    </div>`;
  }).join('');
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[ch]));
}

function printReceipt(id){
  const order = orders.find(o => String(o.id) === String(id));
  if(!order){
    notify('Error','Order not found for receipt.','err');
    return;
  }

  const receiptWindow = window.open('', '_blank', 'width=420,height=760');
  if(!receiptWindow){
    notify('Error','Allow pop-ups to print receipts.','err');
    return;
  }

  const createdAt = order.created_at
    ? new Date(order.created_at).toLocaleString('en-UG', { dateStyle:'medium', timeStyle:'short' })
    : '—';
  const itemsHtml = (order.items || []).map(item => `
    <tr>
      <td>${escapeHtml(item.emoji || '')} ${escapeHtml(item.name || '')}</td>
      <td style="text-align:center;">${escapeHtml(item.qty || 0)}</td>
      <td style="text-align:right;">UGX ${((item.price || 0) * (item.qty || 0)).toLocaleString()}</td>
    </tr>
  `).join('');

  receiptWindow.document.write(`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Receipt #${escapeHtml(order.id)}</title>
<style>
body{font-family:Arial,sans-serif;color:#111;margin:0;padding:24px;background:#fff;}
.wrap{max-width:320px;margin:0 auto;}
h1{font-size:20px;margin:0 0 6px;}
.sub{font-size:12px;color:#555;margin-bottom:18px;}
.meta{font-size:13px;line-height:1.6;margin-bottom:14px;}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px;}
th,td{padding:7px 0;border-bottom:1px dashed #bbb;vertical-align:top;}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;}
.total{font-weight:700;font-size:15px;text-align:right;margin-top:12px;}
.note{font-size:12px;margin-top:12px;padding-top:10px;border-top:1px solid #ddd;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>FlexiOrder</h1>
    <div class="sub">Makindye · Kampala</div>
    <div class="meta">
      <div><strong>Receipt:</strong> #${escapeHtml(order.id)}</div>
      <div><strong>Table:</strong> ${escapeHtml(order.table_name || '—')}</div>
      <div><strong>Customer:</strong> ${escapeHtml(order.customer || 'Guest')}</div>
      ${order.payment_method ? `<div><strong>Payment:</strong> ${escapeHtml(order.payment_method)}</div>` : ''}
      ${order.payment_contact ? `<div><strong>Payment Contact:</strong> ${escapeHtml(order.payment_contact)}</div>` : ''}
      <div><strong>Status:</strong> ${escapeHtml(order.status || 'pending')}</div>
      <div><strong>Time:</strong> ${escapeHtml(createdAt)}</div>
    </div>
    <table>
      <thead>
        <tr><th>Item</th><th style="text-align:center;">Qty</th><th style="text-align:right;">Amount</th></tr>
      </thead>
      <tbody>${itemsHtml}</tbody>
    </table>
    <div class="total">Total: UGX ${(order.total || 0).toLocaleString()}</div>
    ${order.note ? `<div class="note"><strong>Note:</strong> ${escapeHtml(order.note)}</div>` : ''}
  </div>
</body>
</html>`);
  receiptWindow.document.close();
  receiptWindow.focus();
  receiptWindow.print();
}

// ════════════════════════════════════════
// ORDER ACTIONS
// ════════════════════════════════════════
async function updStatus(id, status){
  try{
    const res = await fetch(getApiUrl()+'/api/orders/'+id, {
      method:'PATCH',
      headers:{'Content-Type':'application/json','X-API-Key':API_KEY},
      body: JSON.stringify({status})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    await fetchOrders();
  } catch(e){ notify('Error','Could not update status.','err'); }
}

async function delOrder(id){
  if(!isManager()){
    notify('Not Allowed','Only management can remove orders.','err');
    return;
  }
  if(!confirm('Remove order #'+id+'?')) return;
  try{
    await fetch(getApiUrl()+'/api/orders/'+id, {method:'DELETE', headers:{'X-API-Key':API_KEY}});
    orders = orders.filter(o=>o.id!==id);
    render();
  } catch(e){ notify('Error','Could not delete.','err'); }
}

async function clearDelivered(){
  if(!isManager()){
    notify('Not Allowed','Only management can clear orders.','err');
    return;
  }
  if(!confirm('Remove all delivered orders?')) return;
  try{
    await fetch(getApiUrl()+'/api/orders/delivered', {method:'DELETE', headers:{'X-API-Key':API_KEY}});
    await fetchOrders();
  } catch(e){ notify('Error','Could not clear.','err'); }
}

// ════════════════════════════════════════
// API URL SETTINGS
// ════════════════════════════════════════
function saveApiUrl(){
  const val = document.getElementById('apiUrlInput').value.trim().replace(/\/$/, '');
  if(!val){ showMsg('apiMsg','Enter a valid URL.','err'); return; }
  localStorage.setItem('climax_api_url', val);
  showMsg('apiMsg','Saved! Reconnecting…','ok');
  renderSettingsData();
  setTimeout(fetchOrders, 800);
}

// ════════════════════════════════════════
// PASSWORD CHANGE
// ════════════════════════════════════════
function changePassword(){
  const cur=document.getElementById('curPw').value;
  const nw=document.getElementById('newPw').value;
  const conf=document.getElementById('confPw').value;
  if(cur!==getPassword()){document.getElementById('curPw').classList.add('err');showMsg('pwMsg','✕ Current password wrong.','err');return;}
  if(nw.length<6){document.getElementById('newPw').classList.add('err');showMsg('pwMsg','✕ Min 6 characters.','err');return;}
  if(nw!==conf){document.getElementById('confPw').classList.add('err');showMsg('pwMsg','✕ Passwords do not match.','err');return;}
  savePassword(nw);
  ['curPw','newPw','confPw'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('pwStrength').style.display='none';
  showMsg('pwMsg','✓ Password updated!','ok');
  notify('Password Changed','New password saved.','ok');
}
function onNewPw(){
  clearPwUi();
  const pw=document.getElementById('newPw').value;
  const sw=document.getElementById('pwStrength');
  if(!pw){sw.style.display='none';return;}
  sw.style.display='block';
  let sc=0;
  if(pw.length>=6)sc++;if(pw.length>=10)sc++;
  if(/[A-Z]/.test(pw))sc++;if(/[0-9]/.test(pw))sc++;if(/[^A-Za-z0-9]/.test(pw))sc++;
  const lv=[{w:'18%',c:'var(--pink)',t:'Too short'},{w:'36%',c:'var(--pink)',t:'Weak'},{w:'56%',c:'var(--amber)',t:'Fair'},{w:'78%',c:'var(--cyan)',t:'Good'},{w:'100%',c:'var(--lime)',t:'Strong'}][Math.min(sc,4)];
  document.getElementById('pwFill').style.width=lv.w;
  document.getElementById('pwFill').style.background=lv.c;
  document.getElementById('pwLbl').textContent=lv.t;
  document.getElementById('pwLbl').style.color=lv.c;
}
function clearPwUi(){
  document.getElementById('pwMsg').style.display='none';
  ['curPw','newPw','confPw'].forEach(id=>document.getElementById(id).classList.remove('err'));
}
function showMsg(id,text,type){
  const el=document.getElementById(id);
  el.textContent=text;el.className='sf-msg '+type;el.style.display='block';
  if(type==='ok') setTimeout(()=>{el.style.display='none';},5000);
}


// ════════════════════════════════════════
// RECORDS — orders grouped by date
// ════════════════════════════════════════
function renderRecords(){
  const wrap = document.getElementById('recordsWrap');
  if(!orders.length){
    wrap.innerHTML = '<div class="records-empty">No orders recorded yet.</div>';
    return;
  }

  // Group all orders by date (YYYY-MM-DD)
  const groups = {};
  orders.forEach(o => {
    const date = o.created_at ? o.created_at.substring(0, 10) : 'Unknown';
    if(!groups[date]) groups[date] = [];
    groups[date].push(o);
  });

  // Sort dates newest first
  const sortedDates = Object.keys(groups).sort((a,b) => b.localeCompare(a));

  wrap.innerHTML = sortedDates.map((date, idx) => {
    const dayOrders = groups[date];
    const total     = dayOrders.reduce((s,o) => s + (o.total||0), 0);
    const revenue   = dayOrders.filter(o=>o.status==='delivered').reduce((s,o) => s + (o.total||0), 0);
    const pending   = dayOrders.filter(o=>o.status!=='delivered').length;
    const allDone   = pending === 0;

    // Format date nicely
    let dateLabel = date;
    try {
      const d = new Date(date + 'T00:00:00');
      dateLabel = d.toLocaleDateString('en-UG', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    } catch(e){}

    const isToday = date === new Date().toISOString().substring(0,10);

    const badge = pending > 0
      ? `<span class="date-badge has-pending">${pending} active</span>`
      : `<span class="date-badge all-done">✔ Complete</span>`;

    const rowsHtml = dayOrders.map(o => {
      const items = Array.isArray(o.items) ? o.items : [];
      return `<div class="rec-row">
        <div class="rec-left">
          <div class="rec-table">${o.table_name || 'Table —'}</div>
          <div class="rec-customer">👤 ${o.customer || 'Guest'}</div>
          ${o.payment_method ? `<div class="rec-customer">💳 ${o.payment_method}</div>` : ''}
          ${o.payment_contact ? `<div class="rec-customer">${escapeHtml(o.payment_contact)}</div>` : ''}
          <div class="rec-id">#${o.id} · <span class="sbadge ${o.status}" style="font-size:.55rem;padding:2px 6px;">${o.status}</span></div>
        </div>
        <div class="rec-items">
          ${items.map(i => `<div class="rec-item-line">${i.emoji||''} ${i.name} <span>×${i.qty} — UGX ${((i.price||0)*i.qty).toLocaleString()}</span></div>`).join('')}
          ${o.note ? `<div class="rec-note">📝 ${o.note}</div>` : ''}
        </div>
        <div class="rec-right">
          <div class="rec-total">UGX ${(o.total||0).toLocaleString()}</div>
          <div class="rec-time">${o.created_at ? o.created_at.substring(11,16) : ''}</div>
        </div>
      </div>`;
    }).join('');

    // Auto-open today, collapse past nights
    const openClass = isToday ? 'open' : '';
    const toggleTxt = isToday ? '▲ Hide' : '▼ Show';

    return `<div class="date-group">
      <div class="date-group-hdr" onclick="toggleDateGroup(this)">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <span class="date-label">${isToday ? 'Today — ' : ''}${dateLabel}</span>
          ${badge}
        </div>
        <div class="date-stats">
          <div class="date-stat"><strong>${dayOrders.length}</strong> orders</div>
          <div class="date-stat rev"><strong>UGX ${revenue.toLocaleString()}</strong> revenue</div>
          <div class="date-toggle" id="toggle-${idx}">${isToday ? '▲ Hide' : '▼ Show'}</div>
        </div>
      </div>
      <div class="date-orders ${openClass}" id="group-${idx}">
        ${rowsHtml}
      </div>
    </div>`;
  }).join('');
}

function toggleDateGroup(hdr){
  const body    = hdr.nextElementSibling;
  const isOpen  = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  const toggle  = hdr.querySelector('.date-toggle');
  if(toggle) toggle.textContent = isOpen ? '▼ Show' : '▲ Hide';
}

// ════════════════════════════════════════
// TABS & FILTER
// ════════════════════════════════════════
function setTab(t,btn){
  if(!isManager() && ['stock','records','settings'].includes(t)) return;
  currentTab=t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.getElementById('sec-'+t).classList.add('on');
  document.getElementById('filterBar').style.display=t==='orders'?'flex':'none';
  render();
}
function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderOrders();
}

// ════════════════════════════════════════
// CLOCK & REFRESH
// ════════════════════════════════════════
function start(){
  requestBrowserNotifications();
  fetchOrders(); // first load
  setInterval(()=>{
    document.getElementById('clock').textContent=
      new Date().toLocaleTimeString('en-UG',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  },1000);
  clearInterval(refreshTimer);
  refreshTimer=setInterval(async()=>{
    cd--;
    const el=document.getElementById('countdown');
    if(el) el.textContent=cd;
    if(cd<=0){ await fetchOrders(); cd=8; }
  },1000);
}
if(sessionStorage.getItem(AUTH_KEY)==='1') start();

// NOTIFICATION
// ════════════════════════════════════════
let notifTimer;
function notify(title,body,type){
  clearTimeout(notifTimer);
  const n=document.getElementById('notif');
  document.getElementById('notifT').textContent=title;
  document.getElementById('notifB').textContent=body;
  n.className='notif show'+(type==='ok'?' ok':type==='err'?' err':'');
  notifTimer=setTimeout(()=>n.classList.remove('show'),5000);
}

// ════════════════════════════════════════
// UTILS
// ════════════════════════════════════════
function ago(iso){
  if(!iso) return '';
  const d=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  if(d<60) return d+'s ago';
  if(d<3600) return Math.floor(d/60)+'m ago';
  return Math.floor(d/3600)+'h ago';
}
