<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FlexiOrder — Scan to Order</title>
<script src="climax-config.js"></script>
<style>
  :root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --gold: #f5c518;
    --bg: #0f0f1a;
    --card: #16213e;
    --card-hover: #1a1a3e;
    --text: #eaeaea;
    --muted: #999;
    --success: #2ecc71;
    --warning: #f39c12;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 100px;
  }

  .header {
    background: linear-gradient(135deg, var(--primary), #0f3460);
    padding: 18px 20px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,.5);
  }
  .header .venue-name { font-size: 1.3rem; font-weight: 700; letter-spacing: .5px; }
  .header .venue-name span { color: var(--accent); }
  .header .table-badge {
    background: var(--accent); color: #fff;
    padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: .85rem;
  }

  .cat-tabs {
    display: flex; overflow-x: auto; gap: 4px;
    padding: 12px 12px 0; scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .cat-tabs::-webkit-scrollbar { height: 0; }
  .cat-tab {
    flex-shrink: 0; padding: 8px 18px; border-radius: 20px;
    background: var(--card); color: var(--muted); font-size: .82rem;
    font-weight: 600; cursor: pointer; transition: all .2s;
    border: 1px solid transparent;
  }
  .cat-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .menu-grid {
    display: grid; grid-template-columns: 1fr; gap: 14px;
    padding: 14px;
  }
  @media(min-width:500px){ .menu-grid { grid-template-columns: 1fr 1fr; } }

  .menu-card {
    background: var(--card); border-radius: var(--radius);
    padding: 16px; display: flex; gap: 14px; align-items: center;
    cursor: pointer; transition: all .2s; position: relative;
    border: 1px solid rgba(255,255,255,.05);
  }
  .menu-card:hover { background: var(--card-hover); border-color: rgba(255,255,255,.12); }
  .menu-card:active { transform: scale(.98); }

  .menu-card .item-img {
    width: 64px; height: 64px; border-radius: 10px;
    background: var(--primary); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; overflow: hidden;
  }
  .menu-card .item-img img { width: 100%; height: 100%; object-fit: cover; }
  .menu-card .item-info { flex: 1; min-width: 0; }
  .menu-card .item-name { font-weight: 700; font-size: .95rem; margin-bottom: 3px; }
  .menu-card .item-desc { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-card .item-price { font-weight: 800; color: var(--gold); font-size: 1rem; margin-top: 5px; }
  .menu-card .item-add {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent); color: #fff; border: none;
    font-size: 1.4rem; line-height: 1; cursor: pointer;
    flex-shrink: 0; transition: all .2s;
  }
  .menu-card .item-add:hover { background: #ff5a75; transform: scale(1.1); }

  .temp-picker { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .temp-btn {
    font-size: .7rem; padding: 4px 12px; border-radius: 12px;
    border: 1px solid var(--muted); background: transparent; color: var(--muted);
    cursor: pointer; font-weight: 600; transition: all .2s;
  }
  .temp-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

  .cart-fab {
    position: fixed; bottom: 20px; right: 20px; z-index: 200;
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--accent); color: #fff; border: none;
    font-size: 1.6rem; cursor: pointer; box-shadow: 0 4px 24px rgba(233,69,96,.4);
    transition: all .25s;
  }
  .cart-fab .cart-count {
    position: absolute; top: -4px; right: -4px;
    background: var(--gold); color: #000; width: 24px; height: 24px;
    border-radius: 50%; font-size: .75rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .cart-panel {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--primary); border-radius: 24px 24px 0 0;
    z-index: 190; max-height: 70vh; display: flex; flex-direction: column;
    box-shadow: 0 -4px 30px rgba(0,0,0,.6);
    transform: translateY(100%); transition: transform .35s cubic-bezier(.4,0,.2,1);
  }
  .cart-panel.open { transform: translateY(0); }
  .cart-handle {
    width: 40px; height: 4px; background: rgba(255,255,255,.2); border-radius: 2px;
    margin: 10px auto;
  }
  .cart-header {
    padding: 8px 20px 12px; display: flex; justify-content: space-between; align-items: center;
  }
  .cart-header h3 { font-size: 1.1rem; }
  .cart-items { flex: 1; overflow-y: auto; padding: 0 20px; }
  .cart-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .cart-item .ci-name { flex: 1; font-size: .85rem; font-weight: 600; }
  .cart-item .ci-temp { font-size: .7rem; color: var(--muted); }
  .cart-item .ci-qty { font-size: .8rem; color: var(--gold); margin: 0 6px; }
  .cart-item .ci-price { font-weight: 700; font-size: .85rem; }
  .cart-item button {
    background: none; border: none; color: var(--accent); font-size: 1.2rem;
    cursor: pointer; padding: 4px 8px;
  }
  .cart-footer {
    padding: 14px 20px 24px; border-top: 1px solid rgba(255,255,255,.1);
    display: flex; flex-direction: column; gap: 10px;
  }
  .cart-total { display: flex; justify-content: space-between; font-weight: 800; font-size: 1.1rem; }
  .cart-total span:last-child { color: var(--gold); }
  .btn-order {
    background: var(--accent); color: #fff; border: none;
    padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem;
    cursor: pointer; transition: all .2s; text-align: center;
  }
  .btn-order:hover { background: #ff5a75; }
  .btn-order:disabled { opacity: .5; cursor: not-allowed; }
  .btn-clear { background: transparent; color: var(--muted); border: 1px solid var(--muted); padding: 8px; border-radius: 8px; cursor: pointer; }

  .toast {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    background: var(--success); color: #fff; padding: 10px 24px;
    border-radius: 20px; font-weight: 700; font-size: .85rem;
    z-index: 999; opacity: 0; transition: opacity .3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--accent); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 180;
    display: none;
  }
  .overlay.show { display: block; }

  .loading, .empty-state {
    text-align: center; padding: 50px 20px; color: var(--muted);
  }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--card); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .payment-section { display: none; padding: 12px 20px; border-top: 1px dashed rgba(255,255,255,.1); }
  .payment-section.visible { display: block; }
</style>
</head>
<body>

<header class="header">
  <div class="venue-name" id="venueName">🍸 <span>Flexi</span>Order</div>
  <div class="table-badge" id="tableBadge">Table —</div>
</header>

<nav class="cat-tabs" id="catTabs"></nav>

<div id="menuContainer" class="menu-grid">
  <div class="loading"><div class="spinner"></div><p>Loading menu…</p></div>
</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"></div>

<button class="cart-fab" id="cartFab" aria-label="View cart">
  🛒
  <span class="cart-count" id="cartCount">0</span>
</button>

<div class="cart-panel" id="cartPanel">
  <div class="cart-handle"></div>
  <div class="cart-header">
    <h3>🛒 Your Order</h3>
    <button class="btn-clear" id="btnClearAll">Clear All</button>
  </div>
  <div class="cart-items" id="cartItemsList">
    <p style="color:var(--muted);text-align:center;padding:20px;">Cart is empty</p>
  </div>
  <div class="payment-section" id="paymentSection">
    <p style="font-size:.8rem;color:var(--muted);text-align:center;">💳 Payment integration ready — connect Stripe/Paystack here</p>
  </div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal">$0.00</span>
    </div>
    <button class="btn-order" id="btnPlaceOrder">📲 Place Order</button>
  </div>
</div>

<script>
// ============================================================
// FlexiOrder — QR Ordering Frontend
// ============================================================

const API = (typeof API_BASE !== 'undefined') ? API_BASE : 'http://localhost:5000';

// Only these categories get cold/warm toggle
const TEMP_CATEGORIES = ['Soft Drinks', 'Beers', 'soft drinks', 'beers'];

const state = {
  tableId: null,
  tableName: '',
  venue: null,
  menuItems: [],
  categories: [],
  cart: [],
  activeCategory: 'All',
  isCartOpen: false,
  isSubmitting: false
};

const $ = (sel) => document.querySelector(sel);

document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  state.tableId = params.get('table') || '';
  state.tableName = state.tableId ? `Table ${state.tableId}` : 'Walk-in';
  document.getElementById('tableBadge').textContent = state.tableName;

  await Promise.all([loadVenue(), loadMenu()]);

  document.getElementById('cartFab').addEventListener('click', toggleCart);
  document.getElementById('overlay').addEventListener('click', closeCart);
  document.getElementById('btnClearAll').addEventListener('click', clearCart);
  document.getElementById('btnPlaceOrder').addEventListener('click', placeOrder);
});

async function loadVenue() {
  try {
    const res = await fetch(`${API}/api/venue/settings`);
    if (res.ok) {
      const data = await res.json();
      state.venue = data.settings || data;
      if (state.venue && state.venue.name) {
        document.getElementById('venueName').innerHTML = `🍸 <span>${escapeHtml(state.venue.name)}</span>`;
      }
    }
  } catch (e) {}
}

async function loadMenu() {
  const container = document.getElementById('menuContainer');
  container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading menu…</p></div>';

  try {
    const res = await fetch(`${API}/api/menu`);
    if (!res.ok) throw new Error(`API returned ${res.status}`);

    let data = await res.json();
    const items = Array.isArray(data) ? data : (data.items || data.menu || []);

    if (!items.length) {
      container.innerHTML = '<div class="empty-state">🍽️<br>No menu items available right now.<br>Please check back soon.</div>';
      document.getElementById('catTabs').innerHTML = '';
      return;
    }

    state.menuItems = items;

    const seen = new Set();
    state.categories = [];
    for (const item of items) {
      const cat = (item.category || 'Other').trim();
      if (!seen.has(cat)) { seen.add(cat); state.categories.push(cat); }
    }

    renderCategoryTabs();
    renderMenu(state.activeCategory);
  } catch (err) {
    container.innerHTML = `<div class="empty-state">⚠️<br>Could not load menu.<br><small>${escapeHtml(err.message)}</small><br><br><button onclick="loadMenu()" style="padding:8px 16px;border-radius:8px;border:1px solid #e94560;background:transparent;color:#e94560;cursor:pointer;">Retry</button></div>`;
  }
}

function renderCategoryTabs() {
  const tabBar = document.getElementById('catTabs');
  let html = `<div class="cat-tab${state.activeCategory==='All'?' active':''}" data-cat="All">All</div>`;
  for (const cat of state.categories) {
    html += `<div class="cat-tab${state.activeCategory===cat?' active':''}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</div>`;
  }
  tabBar.innerHTML = html;
  tabBar.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      state.activeCategory = tab.dataset.cat;
      renderCategoryTabs();
      renderMenu(state.activeCategory);
      document.getElementById('menuContainer').scrollIntoView({ behavior: 'smooth' });
    });
  });
}

function renderMenu(category) {
  const container = document.getElementById('menuContainer');
  const filtered = category === 'All'
    ? state.menuItems
    : state.menuItems.filter(item => (item.category || 'Other').trim() === category);

  if (!filtered.length) {
    container.innerHTML = '<div class="empty-state">🍽️<br>No items in this category.</div>';
    return;
  }

  let html = '';
  for (const item of filtered) {
    const name = escapeHtml(item.name || 'Item');
    const desc = escapeHtml(item.description || '');
    const price = parseFloat(item.price) || 0;
    const cat = (item.category || '').trim();
    const img = item.image_url || '';
    const emoji = item.emoji || getEmoji(cat);
    const supportsTemp = TEMP_CATEGORIES.includes(cat);
    const cartItem = state.cart.find(ci => ci.id === item.id);

    html += `
      <div class="menu-card" data-id="${item.id}">
        <div class="item-img">
          ${img ? `<img src="${escapeHtml(img)}" alt="${name}" loading="lazy" onerror="this.parentElement.textContent='${emoji}'">` : emoji}
        </div>
        <div class="item-info">
          <div class="item-name">${name}</div>
          ${desc ? `<div class="item-desc">${desc}</div>` : ''}
          <div class="item-price">$${price.toFixed(2)}</div>
          ${supportsTemp ? `
            <div class="temp-picker" data-id="${item.id}">
              <button class="temp-btn${cartItem&&cartItem.temperature==='Cold'?' selected':''}" data-temp="Cold" data-id="${item.id}">❄️ Cold</button>
              <button class="temp-btn${cartItem&&cartItem.temperature==='Warm'?' selected':''}" data-temp="Warm" data-id="${item.id}">🔥 Warm</button>
              <button class="temp-btn${!cartItem||!cartItem.temperature?' selected':''}" data-temp="" data-id="${item.id}">—</button>
            </div>` : ''}
        </div>
        <button class="item-add" data-id="${item.id}" data-name="${name}" data-price="${price}" data-cat="${cat}" title="Add to cart">+</button>
      </div>`;
  }

  container.innerHTML = html;

  container.querySelectorAll('.item-add').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      addToCart(parseInt(btn.dataset.id), btn.dataset.name, parseFloat(btn.dataset.price), btn.dataset.cat);
    });
  });

  container.querySelectorAll('.temp-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.id);
      const temp = btn.dataset.temp;
      const parent = btn.parentElement;
      parent.querySelectorAll('.temp-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      const ci = state.cart.find(c => c.id === id);
      if (ci) { ci.temperature = temp || null; renderCart(); }
    });
  });
}

function addToCart(id, name, price, category) {
  const existing = state.cart.find(ci => ci.id === id);
  if (existing) {
    existing.qty += 1;
  } else {
    let temperature = null;
    const tempPicker = document.querySelector(`.temp-picker[data-id="${id}"]`);
    if (tempPicker) {
      const sel = tempPicker.querySelector('.temp-btn.selected');
      if (sel) temperature = sel.dataset.temp || null;
    }
    state.cart.push({ id, name, price, category, temperature, qty: 1 });
  }
  renderCart();
  showToast(`${name} added to cart ✓`);
  renderMenu(state.activeCategory);
}

function removeFromCart(id) {
  state.cart = state.cart.filter(ci => ci.id !== id);
  renderCart();
  renderMenu(state.activeCategory);
}

function clearCart() {
  state.cart = [];
  renderCart();
  renderMenu(state.activeCategory);
  showToast('Cart cleared');
}

function renderCart() {
  const count = state.cart.reduce((sum, ci) => sum + ci.qty, 0);
  const total = state.cart.reduce((sum, ci) => sum + ci.price * ci.qty, 0);

  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;

  const listEl = document.getElementById('cartItemsList');

  if (!state.cart.length) {
    listEl.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;">Cart is empty</p>';
    document.getElementById('btnPlaceOrder').disabled = true;
    return;
  }

  document.getElementById('btnPlaceOrder').disabled = false;

  let html = '';
  for (const ci of state.cart) {
    const tempLabel = ci.temperature ? ` · ${ci.temperature}` : '';
    html += `
      <div class="cart-item">
        <div style="flex:1;min-width:0;">
          <div class="ci-name">${escapeHtml(ci.name)}<span class="ci-temp">${tempLabel}</span></div>
          <span class="ci-qty">×${ci.qty}</span>
        </div>
        <div class="ci-price">$${(ci.price * ci.qty).toFixed(2)}</div>
        <button onclick="removeFromCart(${ci.id})" title="Remove">✕</button>
      </div>`;
  }
  listEl.innerHTML = html;
}

function toggleCart() { state.isCartOpen ? closeCart() : openCart(); }

function openCart() {
  state.isCartOpen = true;
  document.getElementById('cartPanel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}

function closeCart() {
  state.isCartOpen = false;
  document.getElementById('cartPanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

async function placeOrder() {
  if (state.isSubmitting || !state.cart.length) return;

  state.isSubmitting = true;
  const btn = document.getElementById('btnPlaceOrder');
  btn.disabled = true;
  btn.textContent = '⏳ Submitting…';

  const orderData = {
    table_id: state.tableId || null,
    table_name: state.tableName,
    items: state.cart.map(ci => ({
      menu_item_id: ci.id,
      name: ci.name,
      price: ci.price,
      quantity: ci.qty,
      temperature: ci.temperature || null
    })),
    total: state.cart.reduce((sum, ci) => sum + ci.price * ci.qty, 0),
    timestamp: new Date().toISOString()
  };

  try {
    const res = await fetch(`${API}/api/orders`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(orderData)
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error || `Order failed (${res.status})`);
    }

    const result = await res.json();
    showToast(`✅ Order #${result.order_id || result.id || 'placed'} confirmed!`);
    state.cart = [];
    renderCart();
    renderMenu(state.activeCategory);
    closeCart();
  } catch (err) {
    showToast(`❌ ${err.message}`, true);
  } finally {
    state.isSubmitting = false;
    btn.disabled = false;
    btn.textContent = '📲 Place Order';
  }
}

let toastTimer;
function showToast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2500);
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getEmoji(category) {
  const map = {
    'Soft Drinks': '🥤', 'soft drinks': '🥤',
    'Beers': '🍺', 'beers': '🍺',
    'Spirits': '🥃', 'spirits': '🥃',
    'Wines': '🍷', 'wines': '🍷',
    'Cocktails': '🍹', 'cocktails': '🍹',
    'Food': '🍔', 'food': '🍔',
    'Snacks': '🍟', 'snacks': '🍟',
    'Desserts': '🍰', 'desserts': '🍰',
    'Coffee': '☕', 'coffee': '☕',
    'Tea': '🍵', 'tea': '🍵'
  };
  return map[category] || '🍽️';
}
</script>

</body>
</html>
